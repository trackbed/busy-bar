rules:
  unpinned-uses:
    config:
      policies:
        # Every remote action is pinned to a full commit SHA with a version
        # comment, so Dependabot can still propose updates.
        '*': hash-pin
  self-repository:
    # actionlint 1.7.12 rejects GitHub's `uses: $/...` syntax (July 2026), so
    # local actions keep the `./` form. Revisit when actionlint supports it.
    disable: true
