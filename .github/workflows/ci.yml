name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Weekly full sweep and dependency audit, Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: nx-set-shas uses its last successful run as the base.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # Fail instead of re-locking when uv.lock is out of date.
  UV_LOCKED: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # nx-set-shas looks up the last successful run on main.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Nx keeps its task cache and the cache index together under ~/.nx.
      - name: Restore Nx cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nx
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('yarn.lock', 'uv.lock') }}-
            nx-${{ runner.os }}-

      - name: Check formatting
        run: yarn format:check

      - name: Check TypeScript project references
        run: yarn nx sync:check

      - name: Check project tags, targets, and boundaries
        run: yarn nx run repo:check-projects

      - name: Check for unused files, exports, and dependencies
        run: yarn nx run repo:knip

      - name: Lint, type-check, and test
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            yarn nx run-many -t lint typecheck test --outputStyle=static
          else
            yarn nx affected -t lint typecheck test --outputStyle=static
          fi

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
          enable-cache: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format=github .github

  audit:
    name: Dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Audit npm dependencies
        run: yarn npm audit --all --recursive --severity high

      - name: Audit Python dependencies
        # uv marks the audit command as a preview feature.
        run: uv audit --preview-features audit-command

  ci:
    # The only check branch protection needs to require.
    name: CI
    if: always()
    needs: [verify, workflows, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A required job finished with: $result"
                exit 1
                ;;
            esac
          done
