name: Set up workspace
description: >-
  Install the pinned Node.js, Yarn, uv, and Python, then the workspace's Node
  and Python dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        # Yarn comes from Corepack below; setup-node would cache it too early.
        package-manager-cache: false

    - name: Enable Corepack
      shell: bash
      run: |
        # Corepack downloads Yarn on the first `yarn` call, in a later step.
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"
        corepack enable

    - name: Restore Yarn cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - name: Install Node.js dependencies
      shell: bash
      run: yarn install --immutable

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.13.0'
        enable-cache: true
        cache-python: true
        cache-dependency-glob: uv.lock

    - name: Install Python and Python dependencies
      shell: bash
      run: uv sync --all-packages --locked
