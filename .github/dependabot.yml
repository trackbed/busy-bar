version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Match the seven-day release-age gate in .yarnrc.yml and pyproject.toml,
    # so every proposed version can actually install.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # package.json files pin exact versions; bump the pin itself.
    versioning-strategy: increase
    groups:
      nx:
        patterns: ['nx', '@nx/*']
      lint:
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint-community/*',
            'typescript-eslint',
            'oxlint',
            'oxfmt',
          ]
      vitest:
        patterns: ['vitest', '@vitest/*', 'vite']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Match the seven-day release-age gate in .yarnrc.yml and pyproject.toml,
    # so every proposed version can actually install.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns: ['mypy', 'pytest', 'pytest-*', 'ruff']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    # Match the seven-day release-age gate in .yarnrc.yml and pyproject.toml,
    # so every proposed version can actually install.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
