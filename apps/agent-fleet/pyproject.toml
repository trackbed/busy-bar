[project]
name = "agent-fleet"
version = "0.0.1"
description = "BUSY Bar board for every Claude Code session you run, fed by its hooks."
requires-python = ">=3.14"
dependencies = ["bar-kit"]

[tool.uv.sources]
bar-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.14"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]
# The process entry points only wire the modules together (__main__.py) or
# print sample frames (preview.py); the other modules hold the behavior.
omit = ["src/agent_fleet/__main__.py", "src/agent_fleet/preview.py"]

[tool.coverage.report]
# Ratchet upward; never lower it to make a change pass.
fail_under = 95
show_missing = true
