[project]
name = "claude-limits"
version = "0.0.1"
description = "BUSY Bar board for the Claude accounts conductor-claude-rotation manages."
requires-python = ">=3.14"
dependencies = ["bar-kit"]

[tool.uv.sources]
bar-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]
# The process entry points only wire the modules together (__main__.py) or
# print sample frames (preview.py); the other modules hold the behavior.
omit = ["src/claude_limits/__main__.py", "src/claude_limits/preview.py"]

[tool.coverage.report]
# Ratchet upward; never lower it to make a change pass.
fail_under = 95
show_missing = true
