[project]
name = "countdown"
version = "0.0.1"
description = "BUSY Bar app that counts down to an event."
requires-python = ">=3.14"
dependencies = ["bar-kit"]

[tool.uv.sources]
bar-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]
# The process entry points only wire the kit together (__main__.py) or print
# sample frames (preview.py); render.py and settings.py hold the behavior.
omit = ["src/countdown/__main__.py", "src/countdown/preview.py"]

[tool.coverage.report]
# Ratchet upward; never lower it to make a change pass.
fail_under = 95
show_missing = true
