[project]
name = "countdown"
version = "0.0.1"
description = "BUSY Bar app that counts down to an event."
requires-python = ">=3.14"
dependencies = ["bar-kit"]

[tool.uv.sources]
bar-kit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["src"]
# The process entry point only wires the kit together; render.py and
# settings.py hold the behavior.
omit = ["src/countdown/__main__.py"]

[tool.coverage.report]
# Ratchet upward; never lower it to make a change pass.
fail_under = 95
show_missing = true
