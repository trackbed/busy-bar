nodeLinker: node-modules

# Dependency installation policy (see docs/dependencies.md):
# - Third-party install scripts never run. Workspace-owned scripts, such as the
#   root postinstall that installs Git hooks, still do.
# - Git dependencies are blocked.
# - A new npm release must be at least seven days old before it can resolve.
#   Exceptions go in npmPreapprovedPackages with exact versions, a reason, and
#   a removal date.
enableScripts: false
approvedGitRepositories: []
npmMinimalAgeGate: 7d

# `yarn add pkg` pins the exact version instead of a ^ range.
defaultSemverRangePrefix: ''

# Keep the install state with the tree it describes, so a node_modules
# directory restored from a CI cache never pairs with a stale state file.
installStatePath: ./node_modules/.yarn-install-state.gz
